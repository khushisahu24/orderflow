name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: orderflow
          POSTGRES_PASSWORD: orderflow
          POSTGRES_DB: orderflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderflow -d orderflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ORDERFLOW_TEST_DATABASE_URL: postgresql+psycopg://orderflow:orderflow@localhost:5432/orderflow_test
      ORDERFLOW_DATABASE_URL: postgresql+psycopg://orderflow:orderflow@localhost:5432/orderflow_test
      ORDERFLOW_JWT_SECRET: ci-only-secret-not-for-production-use-32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --junitxml=reports/junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit.xml
